        // --- Helper: Number to Words ---
        function numToWords(n) {
            if (!n) return "";
            const num = parseInt(n);
            if (isNaN(num)) return "";

            const units = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
            const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

            function convertUnderThousand(num) {
                if (num < 20) return units[num];
                const digitTen = Math.floor(num / 10);
                const digitUnit = num % 10;
                return (tens[digitTen] + " " + units[digitUnit]).trim();
            }

            let words = "";
            let val = num;

            if (val >= 10000000) {
                words += convertUnderThousand(Math.floor(val / 10000000)) + " Crore ";
                val %= 10000000;
            }

            if (val >= 100000) {
                words += convertUnderThousand(Math.floor(val / 100000)) + " Lakh ";
                val %= 100000;
            }

            if (val >= 1000) {
                words += convertUnderThousand(Math.floor(val / 1000)) + " Thousand ";
                val %= 1000;
            }

            if (val >= 100) {
                words += convertUnderThousand(Math.floor(val / 100)) + " Hundred ";
                val %= 100;
            }

            if (val > 0) {
                words += convertUnderThousand(val);
            }

            return words.trim();
        }

                        const match = periodStr.match(/(\d+)/);

                                const totalConsideration = totalRent + secAmount;
                                const duty = Math.round(totalConsideration * 0.02); // 2% of Total Consideration

                                newData.totalAmount = totalConsideration.toLocaleString('en-IN');

                            }

                                    const dd = String(end.getDate()).padStart(2, '0');
                                    newData.endDate = `${yyyy}-${mm}-${dd}`;
                                }
                            }
                        }
                        return newData;
                    });
