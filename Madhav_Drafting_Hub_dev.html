        window.onerror = function (msg, url, line, col, error) {
            // Suppress cross-origin CDN "Script error" (line 0) - not a real app error
            if (msg === 'Script error.' || (line === 0 && col === 0)) return true;
            // Show real app errors during development
            alert("[INSTADEED Error] " + msg + "\nLine: " + line + "\nCol: " + col);
            console.error('[INSTADEED]', msg, 'at', url, line + ':' + col, error);
            return false;
        };

        <div class="fixed inset-0 flex flex-col items-center justify-center bg-slate-50 z-[1000]" id="page-loader-screen" style="font-family: 'Plus Jakarta Sans', sans-serif;">
            <style>
                .doc-skeleton-container {

                .doc-skeleton {

                    right: -1px;
                    width: 18px;
                    height: 18px;
                    background: linear-gradient(135deg, #F1F5F9 45%, #CBD5E1 50%, #fff 55%);

                .doc-line-2 { width: 85%; }
                .doc-line-3 { width: 75%; }
                .doc-line-4 { width: 40%; }
                .doc-line::after {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: -100%;
                    width: 50%;
                    height: 100%;
                    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
                    animation: shimmer 1.5s infinite;
                }
                @keyframes shimmer {
                    0% { left: -100%; }

                }

                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 3px;

                    Preparing template
                </div>
                
                <!-- Status Dots -->
                <div class="flex gap-2 justify-center mb-6">
                    <div class="step-dot active" id="dot-1"></div>
                    <div class="step-dot" id="dot-2"></div>
                    <div class="step-dot" id="dot-3"></div>
                </div>

                <!-- Two-tone Wordmark -->
                <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:1.15rem;letter-spacing:-0.05em;line-height:1;display:inline-flex;align-items:baseline;gap:0;opacity:0.8;">
                    <span style="color:#0F172A">insta</span><span style="color:#2563EB">deed</span>
                    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-size:.55rem;font-weight:800;color:#fff;background:#2563EB;width:15px;height:15px;border-radius:50%;margin-left:3px;align-self:center;display:inline-flex;align-items:center;justify-content:center;line-height:1;">in</span>
                </div>
            </div>
            
            <!-- Inline Script to parse doc name and animate checklist status -->
            <script>
                (function() {
                    const params = new URLSearchParams(window.location.search);
                    const nameParam = params.get('name');
                    const docParam = params.get('doc');
                    
                    let docName = 'Legal Document';
                    if (nameParam) {
                        docName = decodeURIComponent(nameParam);
                    } else if (docParam) {
                        // fallback formatting
                        docName = docParam.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                    }
                    
                    const titleEl = document.getElementById('loader-title');
                    if (titleEl) {
                        titleEl.textContent = 'Loading ' + docName + '...';
                    }
                    
                    // Simple checklist stages
                    const stages = [
                        { text: 'Reading Template Structure', dot: 1 },
                        { text: 'Compiling Document Clauses', dot: 2 },
                        { text: 'Loading Form Input Editor', dot: 3 }
                    ];
                    
                    const statusEl = document.getElementById('loader-status');
                    let currentStage = 0;
                    
                    function advanceStage() {
                        if (currentStage >= stages.length) return;
                        
                        const stage = stages[currentStage];
                        if (statusEl) {
                            statusEl.textContent = stage.text;
                        }
                        
                        // Activate dots
                        for (let i = 1; i <= 3; i++) {
                            const dot = document.getElementById('dot-' + i);
                            if (dot) {
                                dot.classList.toggle('active', i === stage.dot);
                            }
                        }
                        
                        currentStage++;
                        // Advance stages smoothly
                        setTimeout(advanceStage, 220);
                    }
                    
                    // Start status animation
                    advanceStage();
                })();
            </script>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const ActiveFieldContext = React.createContext(null);

        // --- Helper: Number to Words ---
        function numToWords(n) {
            if (!n) return "";
            const num = parseInt(n);
            if (isNaN(num)) return "";

            const units = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
            const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

            function convertUnderThousand(num) {
                if (num < 20) return units[num];
                const digitTen = Math.floor(num / 10);
                const digitUnit = num % 10;
                return (tens[digitTen] + " " + units[digitUnit]).trim();
            }

            let words = "";
            let val = num;

            if (val >= 10000000) {
                words += convertUnderThousand(Math.floor(val / 10000000)) + " Crore ";
                val %= 10000000;
            }

            if (val >= 100000) {
                words += convertUnderThousand(Math.floor(val / 100000)) + " Lakh ";
                val %= 100000;
            }

            if (val >= 1000) {
                words += convertUnderThousand(Math.floor(val / 1000)) + " Thousand ";
                val %= 1000;
            }

            if (val >= 100) {
                words += convertUnderThousand(Math.floor(val / 100)) + " Hundred ";
                val %= 100;
            }

            if (val > 0) {
                words += convertUnderThousand(val);
            }

            return words.trim();
        }

        // --- Components ---

        const Section = ({ title, icon, color = "cyan", children, isOpen: defaultOpen = false, badge: customBadge, fields }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);

            // Compute badge dynamically if fields is provided
            let badge = customBadge;
            if (fields && Array.isArray(fields)) {
                const filled = fields.filter(val => {
                    if (val === undefined || val === null) return false;
                    return val.toString().trim() !== '';
                }).length;
                badge = filled === fields.length ? true : `${filled}/${fields.length}`;
            }

            return (
                <div className={`bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all duration-300 ${isOpen ? 'ring-2 ring-' + color + '-100' : 'hover:shadow-md'}`}>
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full text-left px-4 py-3 bg-gray-50/50 hover:bg-white flex items-center justify-between group transition-colors"
                    >
                        <div className="flex items-center gap-3">
                            <div className={`clay-icon clay-${color} w-8 h-8 rounded-lg !text-sm group-hover:scale-110`}>
                                <i className={`fa-solid ${icon}`}></i>
                            </div>
                            <span className="font-bold text-gray-700 text-sm group-hover:text-gray-900">{title}</span>
                        </div>
                        <div className="flex items-center gap-2">
                            {badge && (
                                badge === true ? (
                                    <span className="text-[10px] bg-emerald-50 text-emerald-600 border border-emerald-100 px-2 py-0.5 rounded-full font-bold flex items-center gap-1 select-none">
                                        <i className="fa-solid fa-check"></i> Complete
                                    </span>
                                ) : (
                                    <span className="text-[10px] bg-amber-50 text-amber-600 border border-amber-100 px-1.5 py-0.5 rounded font-bold select-none">
                                        {badge}
                                    </span>
                                )
                            )}
                            <i className={`fa-solid fa-chevron-down text-gray-400 transition-transform duration-300 ${isOpen ? 'rotate-180 text-' + color + '-500' : ''}`}></i>
                        </div>
                    </button>
                    {isOpen && (
                        <div className="p-4 space-y-3 animate-in fade-in slide-in-from-top-2 duration-200">
                            {children}
                        </div>
                    )}
                </div>
            );
        };

        const Input = ({ label, name = "", type = "text", value = "", onChange, fullWidth, placeholder = "", as = "input", maxLength }) => {
            const getValidationClass = () => {
                if (!value) return "border-gray-200 focus:border-blue-500 focus:ring-blue-500/10 hover:border-gray-300";
                const lowerName = (name || "").toLowerCase();
                if (lowerName.includes('aadhar') || lowerName.includes('aadhaar')) {
                    const digits = value.replace(/\s/g, '');
                    return digits.length === 12
                        ? "border-emerald-500 focus:border-emerald-600 focus:ring-emerald-500/10 bg-emerald-50/10"
                        : "border-amber-400 focus:border-amber-500 focus:ring-amber-500/10 bg-amber-50/5";
                }
                if (lowerName.includes('pan')) {
                    const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]$/;
                    return (value.length === 10 && panRegex.test(value))
                        ? "border-emerald-500 focus:border-emerald-600 focus:ring-emerald-500/10 bg-emerald-50/10"
                        : "border-amber-400 focus:border-amber-500 focus:ring-amber-500/10 bg-amber-50/5";
                }
                if (lowerName.includes('phone') || lowerName.includes('mobile')) {
                    const digits = value.replace(/\D/g, '');
                    return digits.length === 10
                        ? "border-emerald-500 focus:border-emerald-600 focus:ring-emerald-500/10 bg-emerald-50/10"
                        : "border-amber-400 focus:border-amber-500 focus:ring-amber-500/10 bg-amber-50/5";
                }
                if (lowerName.includes('pincode') || (name || "") === 'pinCode') {
                    const digits = value.replace(/\D/g, '');
                    return digits.length === 6
                        ? "border-emerald-500 focus:border-emerald-600 focus:ring-emerald-500/10 bg-emerald-50/10"
                        : "border-amber-400 focus:border-amber-500 focus:ring-amber-500/10 bg-amber-50/5";
                }
                return "border-gray-200 focus:border-blue-500 focus:ring-blue-500/10 hover:border-gray-300";
            };

            const getValidationBadge = () => {
                if (!value) return null;
                const lowerName = (name || "").toLowerCase();
                if (lowerName.includes('aadhar') || lowerName.includes('aadhaar')) {
                    const digits = value.replace(/\s/g, '');
                    return digits.length === 12
                        ? <span className="text-[10px] text-emerald-600 font-semibold flex items-center gap-1 mt-1"><i className="fa-solid fa-circle-check"></i> Valid 12-digit Aadhaar</span>
                        : <span className="text-[10px] text-amber-600 font-semibold flex items-center gap-1 mt-1"><i className="fa-solid fa-circle-exclamation"></i> Enter 12-digit Aadhaar ({digits.length}/12)</span>;
                }
                if (lowerName.includes('pan')) {
                    const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]$/;
                    const isValid = value.length === 10 && panRegex.test(value);
                    return isValid
                        ? <span className="text-[10px] text-emerald-600 font-semibold flex items-center gap-1 mt-1"><i className="fa-solid fa-circle-check"></i> Valid PAN Format</span>
                        : <span className="text-[10px] text-amber-600 font-semibold flex items-center gap-1 mt-1"><i className="fa-solid fa-circle-exclamation"></i> Format: ABCDE1234F ({value.length}/10)</span>;
                }
                if (lowerName.includes('phone') || lowerName.includes('mobile')) {
                    const digits = value.replace(/\D/g, '');
                    return digits.length === 10
                        ? <span className="text-[10px] text-emerald-600 font-semibold flex items-center gap-1 mt-1"><i className="fa-solid fa-circle-check"></i> Valid 10-digit Mobile</span>
                        : <span className="text-[10px] text-amber-600 font-semibold flex items-center gap-1 mt-1"><i className="fa-solid fa-circle-exclamation"></i> Enter 10-digit Mobile ({digits.length}/10)</span>;
                }
                if (lowerName.includes('pincode') || (name || "") === 'pinCode') {
                    const digits = value.replace(/\D/g, '');
                    return digits.length === 6
                        ? <span className="text-[10px] text-emerald-600 font-semibold flex items-center gap-1 mt-1"><i className="fa-solid fa-circle-check"></i> Valid 6-digit Pincode</span>

                            client_id: "92873092183-sampleclientid.apps.googleusercontent.com",
                            callback: (response) => {
                                try {
                                    const base64Url = response.credential.split('.')[1];
                                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                                    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                                    const payload = JSON.parse(jsonPayload);
                                    const userSession = {
                                        name: payload.name,
                                        email: payload.email,
                                        picture: payload.picture
                                    };
                                    localStorage.setItem('instadeed_user_session', JSON.stringify(userSession));
                                    onLogin(userSession);
                                    resetModal();
                                    onClose();
                                } catch (err) {
                                    console.error("Auth error:", err);
                                }
                            }
                        });
                        window.google.accounts.id.renderButton(

                            { theme: "outline", size: "large", width: 280 }

                    }
                };

                initGoogle();
                const interval = setInterval(() => {

                        clearInterval(interval);

                }, 500);

                return () => clearInterval(interval);

                return () => clearInterval(iv);
            }, [step, timer]);

            if (!isOpen) return null;

            const resetModal = () => {
                setStep(1);
                setPhone('');

                setIsVerifying(false);

                    name: "Demo Signee",
                    email: "google.signee@instadeed.com",
                    picture: "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y"
                };
                localStorage.setItem('instadeed_user_session', JSON.stringify(mockUser));
                onLogin(mockUser);
                handleClose();
                alert("Signed in successfully as " + mockUser.name);
            };

            const handleSendOtp = () => {
                if (phone.length !== 10) return;
                setStep(2);
                setTimer(30);
                setOtp(['', '', '', '', '', '']);
                alert("📱 Demo SMS: Verification code sent to +91 " + phone);
            };

            const handleVerifyOtp = () => {
                const code = otp.join('');
                if (code.length < 6) return;
                setIsVerifying(true);
                
                setTimeout(() => {
                    const mockUser = {
                        name: "User " + phone.slice(-4),
                        phone: "+91" + phone,
                        email: phone + "@instadeed.com",
                        picture: "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y"
                    };
                    localStorage.setItem('instadeed_user_session', JSON.stringify(mockUser));
                    onLogin(mockUser);
                    handleClose();
                    alert("Mobile OTP verified successfully!");
                }, 1200);

                    if (prevInput) {
                        prevInput.focus();
                        const newOtp = [...otp];

                try {
                    const json = decodeURIComponent(escape(atob(codeToParse)));
                    const parsed = JSON.parse(json);

                    // Handle both old (direct data) and new ({type, payload}) formats
                    if (parsed.payload && parsed.type) {
                        onImport(parsed.payload, parsed.type); // Pass type back
                    } else {
                        onImport(parsed); // Legacy fallback
                    }

                    if (!element) {
                        const allVars = container.querySelectorAll('[data-var-name]');

            };

                return { day, monthYear };

                    const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
                    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
                    const n = parseInt(num);
                    if (!n || n < 0) return '';

                    const convertUnknown = (n) => {
                        if (n < 20) return a[n];
                        const digit = n % 10;
                        if (n < 100) return b[Math.floor(n / 10)] + (digit ? '-' + a[digit] : ' ');
                        if (n < 1000) return a[Math.floor(n / 100)] + 'Hundred ' + (n % 100 == 0 ? '' : 'and ' + convertUnknown(n % 100));
                        if (n < 100000) return convertUnknown(Math.floor(n / 1000)) + 'Thousand ' + (n % 1000 == 0 ? '' : convertUnknown(n % 1000));
                        if (n < 10000000) return convertUnknown(Math.floor(n / 100000)) + 'Lakh ' + (n % 100000 == 0 ? '' : convertUnknown(n % 100000));
                        return convertUnknown(Math.floor(n / 10000000)) + 'Crore ' + (n % 10000000 == 0 ? '' : convertUnknown(n % 10000000));
                    }
                    return convertUnknown(n).trim();

                        }

                                        <div className="text-[9pt] text-gray-400"><Var name="websiteUrl">{ecommRPData.websiteUrl || '[Website URL]'}</Var></div>
                                        <div className="text-[9pt] text-gray-400 mt-1">Effective Date: <Var name="effectiveDate">{ecommRPData.effectiveDate || '________'}</Var></div>
                                        <div className="w-24 h-[2px] bg-gray-300 mx-auto mt-4"></div>
                                    </div>

                                    <p className="mb-4 text-[10pt]">At <strong><Var name="companyName">{ecommRPData.companyName || '[Company Name]'}</Var></strong>, we strive to ensure complete customer satisfaction. This policy outlines the terms under which you may return products, request refunds, or cancel orders placed through <Var name="websiteUrl">{ecommRPData.websiteUrl || '[Website]'}</Var>.</p>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">1. Cancellation Policy</div>
                                        <p className="text-[10pt]">Orders may be cancelled within <Var name="cancellationWindow">{ecommRPData.cancellationWindow || '24 hours'}</Var> of placement, provided the order has not yet been shipped. Once an order enters the shipping process, cancellation requests cannot be accommodated. To cancel, contact our support team at <Var name="contactEmail">{ecommRPData.contactEmail || '[Email]'}</Var>.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">2. Return Policy</div>
                                        <p className="text-[10pt]">Products may be returned within <strong><Var name="returnWindow">{ecommRPData.returnWindow || '7'}</Var> days</strong> of delivery. Items must be unused, in their original packaging, and with all tags and labels attached. The customer is responsible for return shipping costs unless the return is due to a defective or incorrect product.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">3. Exchange Policy</div>
                                        <p className="text-[10pt]">Exchanges are accepted within <strong><Var name="exchangeWindow">{ecommRPData.exchangeWindow || '15'}</Var> days</strong> of delivery, subject to availability. For exchanges, please contact us with your order number and the desired replacement item.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">4. Non-Returnable Items</div>
                                        <p className="text-[10pt]">The following categories of items are non-returnable and non-refundable: <Var name="nonReturnableItems">{ecommRPData.nonReturnableItems || '[Non-Returnable Items]'}</Var>.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">5. Refund Processing</div>
                                        <p className="text-[10pt]">Upon receipt and inspection of the returned item, refunds will be processed within <strong><Var name="refundProcessingDays">{ecommRPData.refundProcessingDays || '5-7'}</Var> business days</strong> via <Var name="refundMethod">{ecommRPData.refundMethod || '[Refund Method]'}</Var>. Shipping costs are {ecommRPData.shippingCostRefundable === 'Yes' ? 'refundable' : 'non-refundable'}.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">6. Partial Refunds</div>
                                        <p className="text-[10pt]">Partial refunds may be granted in the following situations: <Var name="partialRefundConditions">{ecommRPData.partialRefundConditions || '[Conditions]'}</Var>. The refund amount will be determined after inspection of the returned item.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">7. Damaged or Defective Products</div>
                                        <p className="text-[10pt]">If you receive a damaged or defective product, please contact us within 48 hours of delivery with photographic evidence. We will arrange for a free replacement or full refund at your preference.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">8. Governing Law</div>
                                        <p className="text-[10pt]">This policy is governed by the Consumer Protection Act, 2019 and the laws of the State of <Var name="governingState">{ecommRPData.governingState || '[State]'}</Var>, India. Any disputes shall be subject to the exclusive jurisdiction of the courts in <Var name="governingState">{ecommRPData.governingState || '[State]'}</Var>.</p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="font-bold uppercase text-[10pt] mb-2 border-b border-gray-200 pb-1">9. Contact Us</div>
                                        <div className="ml-4 mt-2 text-[10pt]">
                                            <p><strong>Email:</strong> <Var name="contactEmail">{ecommRPData.contactEmail || '[Email]'}</Var></p>
                                            <p><strong>Phone:</strong> <Var name="contactPhone">{ecommRPData.contactPhone || '[Phone]'}</Var></p>
                                            <p><strong>Website:</strong> <Var name="websiteUrl">{ecommRPData.websiteUrl || '[Website]'}</Var></p>
                                        </div>
                                    </div>

                                    <div className="mt-8 border-t border-gray-300 pt-6">
                                        <div className="flex justify-between items-end">
                                            <div>
                                                <div className="text-[9pt] text-gray-500 uppercase tracking-wider mb-4">For and on behalf of</div>
                                                <div className="font-bold text-[11pt]"><Var name="companyName">{ecommRPData.companyName || '[Company Name]'}</Var></div>
                                                <div className="w-48 border-b border-gray-400 mt-8 mb-1"></div>
                                                <div className="text-[9pt] text-gray-500">Authorized Signatory</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[9pt] text-gray-500 uppercase tracking-wider mb-4">Date</div>
                                                <div className="font-bold text-[11pt]"><Var name="effectiveDate">{ecommRPData.effectiveDate || '________'}</Var></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                            </div>
                        )}
                    </div>

                        {/* Gated Authentication Overlay */}
                        {!user && activeTab !== 'CRM' && (
                            <div className="fixed inset-0 z-[200] flex items-center justify-center" style={{background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)'}}>
                                <div className="absolute inset-0 opacity-10" style={{backgroundImage: "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E\")"}}></div>
                                <div className="relative max-w-md w-full mx-4">
                                    <div className="bg-[#FCFAF5] p-2 border-2 border-[#D8C7A5] shadow-2xl">
                                        <div className="border border-[#D8C7A5] p-8 text-center">
                                            <div className="mb-6">
                                                <div className="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-[#D8C7A5] to-[#b8860b] flex items-center justify-center mb-4 shadow-lg">
                                                    <i className="fa-solid fa-lock text-white text-xl"></i>
                                                </div>
                                                <h2 className="font-serif text-2xl font-bold text-[#1a1a1a] uppercase tracking-widest mb-2">Authentication Required</h2>
                                                <div className="w-16 h-[2px] bg-[#D8C7A5] mx-auto mb-4"></div>
                                                <p className="font-body text-sm text-[#4a4a4a] leading-relaxed">Access to the Automated Drafting Suite is gated. Please authenticate using the credential transmission buttons below to decrypt the interface.</p>
                                            </div>
                                            <div className="space-y-3">
                                                <button
                                                    onClick={() => setShowLogin(true)}
                                                    className="w-full py-3 bg-[#1a1a1a] hover:bg-[#8B0000] text-[#FCFAF5] font-serif font-bold tracking-widest uppercase transition-all text-sm"
                                                >
                                                    <i className="fa-solid fa-key mr-2"></i> Sign In to Proceed
                                                </button>
                                                <a href="landing.html" className="block w-full py-3 border border-[#D8C7A5] hover:bg-[#D8C7A5]/10 text-[#1a1a1a] font-serif font-bold tracking-widest uppercase transition-all text-xs cursor-pointer text-center">
                                                    <i className="fa-solid fa-arrow-left mr-2"></i> Return to Storefront
                                                </a>
                                            </div>
                                            <div className="mt-6 text-[9px] text-[#D8C7A5] uppercase tracking-widest font-serif">
                                                ◆ INSTADEED Secure Portal ◆
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Checkout Modal */}
                        <CheckoutModal
                            isOpen={showCheckoutModal}
                            onClose={() => setShowCheckoutModal(false)}
                            checkoutDetails={checkoutDetails}
                            setCheckoutDetails={setCheckoutDetails}
                            onSubmit={handleOnlinePayment}
                        />

                        {/* Login Modal */}
                        <LoginModal
                            isOpen={showLogin}
                            onClose={() => setShowLogin(false)}
                            onLogin={setUser}
                        />

                        {/* Share Modal */}
                        <ShareModal
                            isOpen={showShare}
                            onClose={() => setShowShare(false)}
                            data={
                                activeTab === 'RENT' ? rentData :
                                    activeTab === 'ATS' ? atsData :
                                        activeTab === 'MUTATION' ? mutationData :
                                            activeTab === 'GNIDA' ? gnidaData :
                                                activeTab === 'TM48' ? tm48Data :
                                                    activeTab === 'TM_APP' ? tmAppData :
                                                        activeTab === 'GNIDA_REGISTRY' ? gnidaRegistryData :
                                                            activeTab === 'GNIDA_PTM' ? gnidaPtmData :
                                                            activeTab === 'ECOMM_TC' ? ecommTCData :
                                                            activeTab === 'ECOMM_PP' ? ecommPPData :
                                                            activeTab === 'ECOMM_RP' ? ecommRPData :
                                                                regData
                            }
                            onImport={(data, type) => {
                                // If type provided (new format), switch tab first
                                if (type) setActiveTab(type);

                                // Note: If type was passed, we trust it. If not, we assume current tab (legacy)
                                const target = type || activeTab;

                                if (target === 'RENT') setRentData(data);
                                else if (target === 'ATS') setAtsData(data);
                                else if (target === 'MUTATION') setMutationData(data);
                                else if (target === 'GNIDA') setGnidaData(data);
                                else if (target === 'TM48') setTm48Data(data);
                                else if (target === 'TM_APP') setTmAppData(data);
                                else if (target === 'GNIDA_REGISTRY') setGnidaRegistryData(data);
                                else if (target === 'GNIDA_PTM') setGnidaPtmData(data);
                                else if (target === 'ECOMM_TC') setEcommTCData(data);
                                else if (target === 'ECOMM_PP') setEcommPPData(data);
                                else if (target === 'ECOMM_RP') setEcommRPData(data);
                                else setRegData(data);
                            }}
                        />

                    </div >
                </ActiveFieldContext.Provider>
            );
        }

                    const root = ReactDOM.createRoot(document.getElementById('root'));
                    root.render(<Home />);
    </script>
</body>

</html>
