    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helper: Number to Words ---
        function numToWords(n) {
            if (!n) return "";
            const num = parseInt(n);
            if (isNaN(num)) return "";

            const units = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
            const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

            function convertUnderThousand(num) {
                if (num < 20) return units[num];
                const digitTen = Math.floor(num / 10);
                const digitUnit = num % 10;
                return (tens[digitTen] + " " + units[digitUnit]).trim();
            }

            let words = "";
            let val = num;

            if (val >= 10000000) {
                words += convertUnderThousand(Math.floor(val / 10000000)) + " Crore ";
                val %= 10000000;
            }

            if (val >= 100000) {
                words += convertUnderThousand(Math.floor(val / 100000)) + " Lakh ";
                val %= 100000;
            }

            if (val >= 1000) {
                words += convertUnderThousand(Math.floor(val / 1000)) + " Thousand ";
                val %= 1000;
            }

            if (val >= 100) {
                words += convertUnderThousand(Math.floor(val / 100)) + " Hundred ";
                val %= 100;
            }

            if (val > 0) {
                words += convertUnderThousand(val);
            }

            return words.trim();
        }

        // --- Components ---

        const Section = ({ title, icon, color = "cyan", children, isOpen: defaultOpen = false }) => {

        const Var = ({ children }) => (

        const FooterButton = ({ onClick, children, variant = "primary" }) => {

            return (

        }

        const Row = ({ label, value }) => (

                <td className="py-2 pl-4 w-1/2 border-b border-gray-200 font-bold text-black">{value || '—'}</td>

        );

        const SignatureBox = ({ title, name, role }) => (
            <div className="border border-blue-100 rounded-lg p-3 bg-blue-50/30 text-center w-full break-inside-avoid shadow-sm">
                <div className="font-bold uppercase mb-2 text-xs tracking-wider text-blue-900">{title}</div>
                <div className="font-bold uppercase text-sm mb-1 text-gray-900 border-b border-blue-100 pb-1 mx-2">{name || '______________________'}</div>
                <div className="text-[10px] text-gray-500 font-medium mt-1">({role})</div>
            </div>
        );

        const ShareModal = ({ isOpen, onClose, data, onImport }) => {
            const [mode, setMode] = useState('SHARE'); // SHARE or IMPORT
            const [importText, setImportText] = useState('');
            const [generatedCode, setGeneratedCode] = useState('');
            const [copyStatus, setCopyStatus] = useState('Copy Code');

            useEffect(() => {
                if (isOpen && mode === 'SHARE') {
                    // Generate Code
                    try {
                        // We wrap data with type to ensure correct loading
                        const payload = { type: data.type || 'RENT', payload: data };
                        const json = JSON.stringify(payload);
                        const code = btoa(unescape(encodeURIComponent(json)));

                        // Construct Link
                        const baseUrl = window.location.href.split('#')[0];
                        const link = `${baseUrl}#data=${code}`;

                        setGeneratedCode(link);
                    } catch (e) { console.error(e); }
                }
            }, [isOpen, mode, data]);

            const handleCopy = () => {
                navigator.clipboard.writeText(generatedCode);
                setCopyStatus('Copied!');
                setTimeout(() => setCopyStatus('Copy Code'), 2000);
            };

            const handleWhatsApp = () => {
                const text = `Please fill/check the agreement details using this link:\n\n${generatedCode}\n\n(Or send back the code if link doesn't work)`;
                const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            };

            const isLinkTooLong = generatedCode.length > 2000;

            const handleImportClick = () => {
                if (!importText.trim()) return;
                let codeToParse = importText.trim();

                // If it's a URL, extract the hash
                if (codeToParse.includes('#data=')) {
                    codeToParse = codeToParse.split('#data=')[1];
                }

                try {
                    const json = decodeURIComponent(escape(atob(codeToParse)));
                    const parsed = JSON.parse(json);

                    // Handle both old (direct data) and new ({type, payload}) formats
                    if (parsed.payload && parsed.type) {
                        onImport(parsed.payload, parsed.type); // Pass type back
                    } else {
                        onImport(parsed); // Legacy fallback
                    }

                    onClose();
                    setImportText('');
                    alert("Data loaded successfully!");
                } catch (e) {
                    console.error(e);
                    alert("Invalid Link or Code. Please check and try again.");
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="flex border-b border-gray-100">
                            <button
                                onClick={() => setMode('SHARE')}
                                className={`flex-1 py-4 text-sm font-bold transition-colors ${mode === 'SHARE' ? 'bg-blue-50 text-blue-700 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}
                            >
                                <i className="fa-solid fa-share-nodes mr-2"></i> Share / Send
                            </button>
                            <button
                                onClick={() => setMode('IMPORT')}
                                className={`flex-1 py-4 text-sm font-bold transition-colors ${mode === 'IMPORT' ? 'bg-indigo-50 text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-500 hover:bg-gray-50'}`}
                            >
                                <i className="fa-solid fa-download mr-2"></i> Receive / Load
                            </button>
                        </div>

                        <div className="p-6">
                            {mode === 'SHARE' ? (
                                <div className="space-y-4">
                                    <div className="p-3 bg-blue-50 text-blue-800 text-xs rounded-lg border border-blue-100">
                                        <strong>Magic Link:</strong> Share this link. When opened, it will auto-fill the form.
                                        {isLinkTooLong && <div className="mt-1 text-red-600 font-bold"><i className="fa-solid fa-triangle-exclamation"></i> Link is very long! It might get cut off in some apps.</div>}
                                    </div>
                                    <textarea
                                        readOnly
                                        value={generatedCode}
                                        className="w-full h-32 bg-gray-50 border border-gray-200 rounded-xl p-3 text-[10px] font-mono text-gray-600 outline-none resize-none break-all"
                                    />
                                    <div className="flex gap-2">
                                        <button onClick={handleWhatsApp} className="flex-1 bg-[#25D366] hover:bg-[#128C7E] text-white py-2.5 rounded-xl font-bold text-sm transition-colors shadow-sm flex items-center justify-center gap-2">
                                            <i className="fa-brands fa-whatsapp text-lg"></i> Share Link
                                        </button>
                                        <button onClick={handleCopy} className="flex-1 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 py-2.5 rounded-xl font-bold text-sm transition-colors shadow-sm">
                                            <i className="fa-regular fa-copy mr-1"></i> {copyStatus}
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="p-3 bg-indigo-50 text-indigo-800 text-xs rounded-lg border border-indigo-100">
                                        Paste the <strong>Full Link</strong> or <strong>Code</strong> here to load data.
                                    </div>
                                    <textarea
                                        value={importText}
                                        onChange={e => setImportText(e.target.value)}
                                        placeholder="Paste Code Here..."
                                        className="w-full h-32 bg-white border border-gray-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 rounded-xl p-3 text-xs font-mono text-gray-800 outline-none resize-none transition-all"
                                    />
                                    <button onClick={handleImportClick} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm transition-colors shadow-lg shadow-indigo-200">
                                        <i className="fa-solid fa-file-import mr-2"></i> Load Data
                                    </button>
                                </div>
                            )}

                const numberToWordsIndian = (num) => {
                    const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
                    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
                    const n = parseInt(num);
                    if (!n || n < 0) return '';

                    const convertUnknown = (n) => {
                        if (n < 20) return a[n];
                        const digit = n % 10;
                        if (n < 100) return b[Math.floor(n / 10)] + (digit ? '-' + a[digit] : ' ');
                        if (n < 1000) return a[Math.floor(n / 100)] + 'Hundred ' + (n % 100 == 0 ? '' : 'and ' + convertUnknown(n % 100));
                        if (n < 100000) return convertUnknown(Math.floor(n / 1000)) + 'Thousand ' + (n % 1000 == 0 ? '' : convertUnknown(n % 1000));
                        if (n < 10000000) return convertUnknown(Math.floor(n / 100000)) + 'Lakh ' + (n % 100000 == 0 ? '' : convertUnknown(n % 100000));
                        return convertUnknown(Math.floor(n / 10000000)) + 'Crore ' + (n % 10000000 == 0 ? '' : convertUnknown(n % 10000000));
                    }
                    return convertUnknown(n).trim();

                            const target = type || activeTab;

                            if (target === 'RENT') setRentData(data);
                            else if (target === 'ATS') setAtsData(data);
                            else if (target === 'MUTATION') setMutationData(data);
                            else if (target === 'GNIDA') setGnidaData(data);
                            else if (target === 'TM48') setTm48Data(data);
                            else if (target === 'TM_APP') setTmAppData(data);
                            else if (target === 'GNIDA_REGISTRY') setGnidaRegistryData(data);
                            else setRegData(data);
                        }}
                    />

                </div >
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Home />);
    </script>
</body>

</html>
