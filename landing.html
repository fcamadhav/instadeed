<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTADEED G.B. Nagar — Gautam Buddh Nagar's Premium Legal Drafting Suite</title>
<meta name="description" content="Exclusively designed for Gautam Buddh Nagar (Noida, Greater Noida & Yamuna Expressway). Draft rent agreements, authority applications, and business documents online.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --blue:#2563EB;--blue-l:#3B82F6;--blue-d:#1D4ED8;--blue-bg:rgba(59,130,246,0.08);--blue-mid:rgba(59,130,246,0.15);
  --green:#10B981;--green-l:rgba(16,185,129,0.1);--orange:#F97316;--orange-l:rgba(249,115,22,0.1);
  --amber:#F59E0B;--amber-l:rgba(245,158,11,0.1);--purple:#8B5CF6;--purple-l:rgba(139,92,246,0.1);
  --sky:#06B6D4;--sky-l:rgba(6,182,212,0.1);--rose:#F43F5E;--rose-l:rgba(244,63,94,0.1);
  --g50:#0B0F19;--g100:#111827;--g200:#1F2937;--g300:#374151;
  --g400:#9CA3AF;--g500:#D1D5DB;--g600:#E5E7EB;--g700:#F3F4F6;--g800:#F9FAFB;--g900:#FFFFFF;
  --shadow-xs:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
  --shadow-md:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.05);
  --shadow-lg:0 25px 50px -12px rgba(0,0,0,.18);
  --r:12px;--rl:16px;--rxl:20px;--r2xl:24px;--rf:9999px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:'Inter',system-ui,sans-serif;background:#FAFBFD;color:#1E293B;line-height:1.6;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}

/* ═══════════════════════
   TOP ANNOUNCEMENT BAR
   ═══════════════════════ */
.topbar{
  background:linear-gradient(90deg,#0F172A 0%,#1E3A8A 50%,#0F172A 100%);
  padding:.55rem 1.5rem; text-align:center;
  font-size:.78rem; font-weight:500; color:rgba(255,255,255,.9);
  letter-spacing:.02em;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

/* ═══════════════════════
   NAV — Glassmorphism Dark
   ═══════════════════════ */
.nav{
  position:sticky;top:0;z-index:300;
  background:rgba(11,15,25,0.85);
  border-bottom:1px solid rgba(255,255,255,0.06);
  backdrop-filter:blur(20px) saturate(180%);
  transition:all .25s;
}
.nav-inner{
  max-width:1240px;margin:0 auto;
  display:flex;align-items:center;gap:.5rem;
  padding:.8rem 1.5rem;
}
.logo-wrap{
  display:inline-flex;
  align-items:center;
  gap:.65rem;
  cursor:pointer;
  flex-shrink:0;
  text-decoration:none;
}
.logo-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--blue),#3B82F6);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 15px rgba(37,99,235,.3);
  transition:all .3s;
}
.logo-wrap:hover .logo-mark{
  transform:scale(1.04);
  box-shadow:0 0 20px rgba(37,99,235,.5);
}
.logo-mark svg{ width:18px; height:18px; }
.logo-wordmark{
  font-family:'Outfit',sans-serif;
  font-weight:900;
  font-size:1.45rem;
  letter-spacing:-.04em;
  line-height:1;
  display:inline-flex;
  align-items:baseline;
  gap:0;
}
.lw-part1{ color:#FFFFFF; }
.lw-part2{ color:#3B82F6; }
.lw-tld{
  font-family:'Outfit',sans-serif;
  font-size:.65rem;
  font-weight:900;
  color:#0F172A;
  background:#3B82F6;
  width:20px;
  height:20px;
  border-radius:50%;
  margin-left:.25rem;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 6px rgba(59,130,246,.3);
}

.nav-links{flex:1;display:flex;align-items:stretch;justify-content:center;gap:.5rem}
.nav-link{
  font-size:.85rem;font-weight:600;color:#9CA3AF;
  padding:.4rem .9rem;border-radius:var(--rf);
  transition:all .18s;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:.3rem;
}
.nav-link:hover{color:#FFFFFF;background:rgba(255,255,255,0.05)}
.nav-link i.chevron{font-size:.6rem;transition:transform .2s}
.nav-link:hover i.chevron{transform:rotate(180deg)}

.nav-item{position:relative}
.nav-dropdown{
  position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);
  background:#111827;border:1px solid rgba(255,255,255,0.08);border-radius:var(--rl);
  padding:.6rem;min-width:245px;
  box-shadow:0 25px 50px rgba(0,0,0,.5);
  opacity:0;visibility:hidden;transform:translateX(-50%) translateY(-6px);
  transition:all .2s;z-index:100;
}
.nav-item:hover .nav-dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.dd-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.65rem .9rem;border-radius:var(--r);
  color:#D1D5DB;font-size:.84rem;font-weight:600;
  cursor:pointer;transition:all .18s;
}
.dd-item:hover{background:rgba(255,255,255,0.05);color:#FFFFFF}
.dd-icon{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0;
}

.nav-right{display:flex;align-items:center;gap:.65rem;flex-shrink:0}
.nav-phone-pill{
  display:flex;align-items:center;gap:.4rem;
  font-size:.78rem;font-weight:700;color:#9CA3AF;
  border:1px solid rgba(255,255,255,0.12);border-radius:var(--rf);
  padding:.42rem .95rem;transition:all .18s;
}
.nav-phone-pill:hover{border-color:#3B82F6;color:#FFFFFF;background:rgba(59,130,246,0.1)}
.btn-nav-login{
  font-size:.82rem;font-weight:700;color:#FFFFFF;
  border:1px solid rgba(255,255,255,0.18);border-radius:var(--rf);
  padding:.42rem 1.15rem;transition:all .18s;
}
.btn-nav-login:hover{background:rgba(255,255,255,0.06);border-color:#FFFFFF}
.btn-nav-signup{
  font-size:.82rem;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--blue),#3B82F6);
  border-radius:var(--rf);padding:.45rem 1.25rem;
  box-shadow:0 4px 15px rgba(37,99,235,.38);transition:all .2s;
}
.btn-nav-signup:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.5)}

/* ═══════════════════════
   HERO — Dark Slate Adobe
   ═══════════════════════ */
.hero{
  background:#090C15;
  position:relative;
  overflow:hidden;
  padding:6.5rem 1.5rem 5.5rem;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.hero-glow-1 {
  position:absolute;top:-10%;left:-10%;width:50vw;height:50vw;
  background:radial-gradient(circle,rgba(59,130,246,0.12) 0%,transparent 70%);
  filter:blur(80px);pointer-events:none;z-index:0;
}
.hero-glow-2 {
  position:absolute;bottom:-10%;right:-5%;width:45vw;height:45vw;
  background:radial-gradient(circle,rgba(139,92,246,0.1) 0%,transparent 70%);
  filter:blur(80px);pointer-events:none;z-index:0;
}
.hero-inner{
  max-width:1240px;margin:0 auto;
  display:flex;align-items:center;gap:4rem;
  position:relative;z-index:1;
}
.hero-left{flex:1.1;min-width:0;}
.hero-right{
  flex:0.9;
  display:flex;align-items:center;justify-content:center;
  animation:heroFloat 6s ease-in-out infinite alternate;
}
@keyframes heroFloat{
  0%{transform:translateY(0) rotate(0deg)}
  100%{transform:translateY(-15px) rotate(0.5deg)}
}

.hero-badge{
  display:inline-flex;align-items:center;gap:.5rem;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:var(--rf);
  padding:.4rem 1.1rem;font-size:.73rem;font-weight:700;color:#9CA3AF;
  margin-bottom:1.8rem;text-transform:uppercase;letter-spacing:0.04em;
}
.hero-badge .live-dot{
  width:7px;height:7px;border-radius:50%;background:#10B981;flex-shrink:0;
  box-shadow:0 0 0 2px rgba(16,185,129,.25);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(16,185,129,.25)}50%{box-shadow:0 0 0 5px rgba(16,185,129,.1)}}

.hero-h1{
  font-family:'Outfit',sans-serif;
  font-size:clamp(2.4rem,4.8vw,3.8rem);font-weight:900;
  line-height:1.1;letter-spacing:-.04em;color:#FFFFFF;
  margin-bottom:1.3rem;
}
.hero-h1 .grad{
  background:linear-gradient(135deg,#3B82F6 0%,#06B6D4 50%,#10B981 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-sub{
  font-size:1.05rem;color:#9CA3AF;max-width:550px;
  margin-bottom:2.2rem;line-height:1.75;
}

/* ── Search bar ── */
.hero-search-wrap{
  max-width:560px;margin-bottom:1.3rem;
}
.hero-search{
  display:flex;align-items:center;gap:.75rem;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:var(--rf);
  padding:.75rem .95rem .75rem 1.4rem;
  backdrop-filter:blur(10px);
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  transition:all .25s;
}
.hero-search:focus-within{
  border-color:#3B82F6;
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 0 4px rgba(59,130,246,.25),0 15px 35px rgba(0,0,0,.25);
}
.hero-search i{color:#6B7280;font-size:1.1rem;flex-shrink:0}
.hero-search input{
  flex:1;border:none;outline:none;font-size:.98rem;
  color:#FFFFFF;background:transparent;font-family:'Inter',sans-serif;
}
.hero-search input::placeholder{color:#6B7280}
.btn-search{
  font-size:.85rem;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--blue),#3B82F6);
  padding:.55rem 1.45rem;border-radius:var(--rf);
  white-space:nowrap;flex-shrink:0;
  box-shadow:0 4px 12px rgba(37,99,235,.28);
  transition:all .18s;
}
.btn-search:hover{transform:scale(1.02);box-shadow:0 6px 18px rgba(37,99,235,.4)}

.hero-tags{
  display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:2.2rem;
}
.hero-tag{
  font-size:.78rem;font-weight:600;color:#3B82F6;cursor:pointer;
  transition:color .18s;display:flex;align-items:center;gap:.25rem;
}
.hero-tag:hover{color:#FFFFFF;text-decoration:underline}
.hero-tag-sep{color:#374151;font-size:.75rem}

.hero-pills{
  display:flex;gap:.8rem;flex-wrap:wrap;
}
.hero-pill{
  display:inline-flex;align-items:center;gap:.55rem;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:var(--rf);
  padding:.6rem 1.15rem;font-size:.84rem;font-weight:700;color:#E5E7EB;
  cursor:pointer;transition:all .22s;
}
.hero-pill i{font-size:.88rem}
.hero-pill:hover{border-color:#3B82F6;color:#FFFFFF;background:rgba(59,130,246,0.1);transform:translateY(-1px)}

/* Document Card Mockup */
.hero-visual{
  position:relative;width:100%;max-width:440px;
}
.doc-mockup{
  background:#111827;border:1px solid rgba(255,255,255,0.08);border-radius:var(--rxl);
  box-shadow:0 30px 60px rgba(0,0,0,0.4);padding:1.8rem;width:100%;
}
.dm-header{
  display:flex;align-items:center;gap:.85rem;margin-bottom:1.4rem;
}
.dm-icon{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg,rgba(59,130,246,0.1),rgba(139,92,246,0.15));
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;color:#3B82F6;flex-shrink:0;
  border:1px solid rgba(59,130,246,0.2);
}
.dm-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.05rem;color:#FFFFFF}
.dm-sub{font-size:.73rem;color:#6B7280;margin-top:.12rem}
.dm-line{
  height:7px;background:#1F2937;border-radius:4px;margin-bottom:.7rem;
}
.dm-line.w-full{width:100%}
.dm-line.w-3q{width:75%}
.dm-line.w-half{width:50%}
.dm-line.w-2q{width:65%}
.dm-sig-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:1.4rem;padding-top:1.2rem;border-top:1px dashed #1F2937;
}
.dm-sig{
  display:flex;align-items:center;gap:.5rem;
  background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,.2);
  border-radius:var(--rf);padding:.4rem .9rem;
  font-size:.73rem;font-weight:800;color:#10B981;
}
.dm-date{font-size:.73rem;color:#6B7280}

.float-card{
  position:absolute;background:#1F2937;border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--rl);padding:.8rem 1rem;
  box-shadow:0 15px 30px rgba(0,0,0,0.3);
  display:flex;align-items:center;gap:.6rem;
  font-size:.8rem;font-weight:700;color:#E5E7EB;
  animation:cardFloat 6s ease-in-out infinite alternate;
}
.float-card.fc1{top:-20px;right:-15px;animation-duration:7s}
.float-card.fc2{bottom:35px;left:-25px;animation-duration:8s;animation-delay:-3s}
.float-card .fci{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.82rem;
}
@keyframes cardFloat{0%{transform:translateY(0)}100%{transform:translateY(-12px)}}

/* ═══════════════════════
   STATS BAR (Hybrid theme)
   ═══════════════════════ */
.stats-bar{
  background:#FFFFFF;border-bottom:1px solid #E2E8F0;
  padding:1.5rem;box-shadow:var(--shadow-xs);
}
.stats-inner{
  max-width:1050px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
}
.stat-item{text-align:center;padding:.4rem 2.8rem}
.stat-num{
  font-family:'Outfit',sans-serif;
  font-size:1.85rem;font-weight:900;color:#0F172A;line-height:1;
}
.stat-label{font-size:.75rem;color:#64748B;margin-top:.35rem;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;}
.stat-div{width:1px;height:44px;background:#E2E8F0;flex-shrink:0}

/* Trust logos */
.trust-bar{
  background:#F8FAFC;border-bottom:1px solid #E2E8F0;
  padding:1rem 1.5rem;
}
.trust-inner{
  max-width:1050px;margin:0 auto;
  display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;justify-content:center;
}
.trust-label{font-size:.72rem;font-weight:700;color:#64748B;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.trust-sep{width:1px;height:20px;background:#E2E8F0}
.trust-badge{
  display:flex;align-items:center;gap:.45rem;
  font-size:.76rem;font-weight:700;color:#475569;
  background:#FFFFFF;border:1px solid #E2E8F0;border-radius:var(--rf);
  padding:.35rem .95rem;box-shadow:var(--shadow-xs);
}
.trust-badge i{font-size:.8rem}
.trust-badge.green{color:#059669;border-color:rgba(16,185,129,.2);background:#ECFDF5}
.trust-badge.blue{color:#2563EB;border-color:rgba(59,130,246,.15);background:#EFF6FF}

/* ═══════════════════════
   SECTION COMMON
   ═══════════════════════ */
section{position:relative}
.wrapper{max-width:1240px;margin:0 auto;padding:0 1.5rem}
.sp{padding:5.5rem 0}
.sec-label{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#2563EB;background:#EFF6FF;
  border:1px solid rgba(59,130,246,0.15);border-radius:var(--rf);
  padding:.3rem .9rem;margin-bottom:1rem;
}
.sec-title{
  font-family:'Outfit',sans-serif;
  font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:800;
  letter-spacing:-.035em;color:#0F172A;line-height:1.2;
}
.sec-sub{color:#64748B;font-size:1rem;margin-top:.85rem;line-height:1.7;max-width:550px}
.sec-head{text-align:center;margin-bottom:3rem}
.sec-head .sec-sub{margin-left:auto;margin-right:auto}

/* ═══════════════════════
   POPULAR DOCS STRIP
   ═══════════════════════ */
.popular-strip{background:#FFFFFF;border-bottom:1px solid #E2E8F0;padding:1.4rem}
.pop-inner{
  max-width:1240px;margin:0 auto;
  display:flex;align-items:center;gap:1.1rem;overflow-x:auto;
  scrollbar-width:none;
}
.pop-inner::-webkit-scrollbar{display:none}
.pop-label{font-size:.72rem;font-weight:800;color:#64748B;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.pop-sep{width:1px;height:20px;background:#E2E8F0;flex-shrink:0}
.pop-chip{
  display:inline-flex;align-items:center;gap:.5rem;
  background:#F8FAFC;border:1px solid #E2E8F0;border-radius:var(--rf);
  padding:.42rem 1.05rem;font-size:.82rem;font-weight:700;color:#475569;
  white-space:nowrap;cursor:pointer;transition:all .18s;flex-shrink:0;
}
.pop-chip i{font-size:.8rem}
.pop-chip:hover{background:#EFF6FF;border-color:#3B82F6;color:#2563EB}
.pop-chip.hot{background:#FFF7ED;border-color:rgba(249,115,22,.25);color:#F97316}

/* ═══════════════════════
   HOW IT WORKS (Adobe style card steps)
   ═══════════════════════ */
.how-section{background:#F8FAFC;border-bottom:1px solid #E2E8F0}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8rem;position:relative}
.steps-grid::after{
  content:'';position:absolute;
  top:48px;left:calc(33.3% + 0px);right:calc(33.3% + 0px);
  height:2px;background:linear-gradient(90deg,rgba(59,130,246,0.1),rgba(59,130,246,0.4),rgba(59,130,246,0.1));
  z-index:0;
}
.step-card{
  background:#FFFFFF;border:1px solid #E2E8F0;border-radius:var(--rxl);
  padding:2.2rem 1.8rem;text-align:center;position:relative;z-index:1;
  box-shadow:var(--shadow-xs);transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow:hidden;
}
.step-card:hover{box-shadow:0 15px 30px rgba(0,0,0,0.05);transform:translateY(-4px);border-color:#3B82F6}
.step-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),#8B5CF6);
  transform:scaleX(0);transform-origin:left;transition:transform .3s;
}
.step-card:hover::before{transform:scaleX(1)}
.step-bubble{
  width:44px;height:44px;border-radius:50%;
  background:#EFF6FF;border:2px solid rgba(59,130,246,.2);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 1.4rem;transition:all .25s;
}
.step-card:hover .step-bubble{background:#2563EB;border-color:#2563EB}
.step-bubble span{
  font-family:'Outfit',sans-serif;font-weight:900;
  font-size:.9rem;color:#2563EB;transition:color .25s;
}
.step-card:hover .step-bubble span{color:#fff}
.step-icon-box{
  width:46px;height:46px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  margin:0 auto 1.25rem;
}
.step-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.05rem;color:#0F172A;margin-bottom:.6rem}
.step-desc{font-size:.85rem;color:#64748B;line-height:1.7}
.step-link{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.8rem;font-weight:800;color:#2563EB;
  margin-top:1.1rem;cursor:pointer;transition:gap .2s;
}
.step-link:hover{gap:.55rem}

/* ═══════════════════════
   DOCUMENT CATALOG (Adobe Product Grid)
   ═══════════════════════ */
.catalog-section{background:#FFFFFF;border-bottom:1px solid #E2E8F0}
.search-row{max-width:480px;margin:0 auto 2rem;position:relative}
.catalog-search{
  width:100%;padding:.75rem 1.2rem .75rem 2.8rem;
  border:1.5px solid #E2E8F0;border-radius:var(--rf);
  font-size:.9rem;color:#0F172A;background:#F8FAFC;
  font-family:'Inter',sans-serif;outline:none;transition:all .2s;
}
.catalog-search:focus{border-color:#3B82F6;background:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.1)}
.catalog-search-icon{position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:.9rem;pointer-events:none}

.cat-tabs{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:2.2rem}
.cat-tab{
  font-size:.82rem;font-weight:700;padding:.45rem 1.15rem;border-radius:var(--rf);
  border:1.5px solid #E2E8F0;background:#fff;color:#475569;
  cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif;
}
.cat-tab:hover{border-color:#3B82F6;color:#2563EB}
.cat-tab.active{background:#2563EB;border-color:#2563EB;color:#fff}

.docs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
}
.adobe-card {
  background: #ffffff;
  border: 1.5px solid #E2E8F0;
  border-radius: var(--rl);
  padding: 1.8rem;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  box-shadow: var(--shadow-xs);
}
.adobe-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.06);
  border-color: #3B82F6;
}
.adobe-card-icon-wrap {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  margin-bottom: 1.25rem;
}
.adobe-card-title {
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 1.08rem;
  color: #0F172A;
  margin-bottom: 0.6rem;
  line-height: 1.35;
}
.adobe-card-desc {
  font-size: 0.84rem;
  color: #64748B;
  line-height: 1.65;
  margin-bottom: 1.5rem;
  flex-grow: 1;
}
.adobe-card-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
}
.adobe-card-link {
  font-size: 0.85rem;
  font-weight: 800;
  color: #2563EB;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: gap 0.2s;
}
.adobe-card:hover .adobe-card-link {
  color: #1D4ED8;
  gap: 0.55rem;
}
.adobe-card-badge {
  position: absolute;
  top: 1.2rem;
  right: 1.2rem;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 0.2rem 0.65rem;
  border-radius: var(--rf);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ═══════════════════════
   AUDIENCE SECTION
   ═══════════════════════ */
.audience-section{background:#F8FAFC;border-bottom:1px solid #E2E8F0}
.audience-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  border:1px solid #E2E8F0;border-radius:var(--rxl);
  overflow:hidden;background:#E2E8F0;gap:1px;
}
.aud-card{
  background:#fff;padding:1.8rem 1.6rem;
  cursor:pointer;transition:all .2s;position:relative;
}
.aud-card:hover{background:#EFF6FF}
.aud-dot{
  position:absolute;width:12px;height:12px;border-radius:50%;
  top:0;left:0;transform:translate(-50%,-50%);
  background:#E2E8F0;border:1px solid #CBD5E1;z-index:1;
}
.aud-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;
  margin-bottom:1rem;
}
.aud-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:1rem;color:#0F172A;margin-bottom:.45rem}
.aud-desc{font-size:.85rem;color:#64748B;line-height:1.65}

/* ═══════════════════════
   FEATURES BENTO (Redesigned)
   ═══════════════════════ */
.features-section{background:#090C15;color:#FFFFFF;border-bottom:1px solid rgba(255,255,255,0.05)}
.features-section .sec-title{color:#FFFFFF}
.features-section .sec-sub{color:#9CA3AF}
.features-section .sec-label{background:rgba(59,130,246,0.1);color:#3B82F6;border-color:rgba(59,130,246,0.2)}
.bento{
  display:grid;grid-template-columns:repeat(3,1fr);
  grid-auto-rows:auto;gap:1.5rem;
}
.bento-card{
  background:#111827;border:1px solid rgba(255,255,255,0.06);border-radius:var(--rxl);
  padding:2rem;box-shadow:var(--shadow-xs);transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
.bento-card:hover{
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
  transform:translateY(-3px);
  border-color:#3B82F6;
}
.bento-card.hero-card-feat{
  grid-column:span 2;
  background:linear-gradient(135deg,#1E293B 0%,#0F172A 100%);
}
.bento-card.hero-card-feat .bento-title{color:#fff}
.bento-card.hero-card-feat .bento-desc{color:#9CA3AF}
.bfi{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:1.4rem}
.bento-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.05rem;color:#FFFFFF;margin-bottom:.55rem}
.bento-desc{font-size:.85rem;color:#9CA3AF;line-height:1.7}
.bento-card.hero-card-feat .bfi{background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.25)}
.bento-card.hero-card-feat .bfi i{color:#3B82F6}

/* ═══════════════════════
   TESTIMONIALS
   ═══════════════════════ */
.testi-section{background:#F8FAFC;border-bottom:1px solid #E2E8F0}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.testi-card{
  background:#fff;border:1px solid #E2E8F0;border-radius:var(--rxl);
  padding:1.8rem;transition:all .25s;box-shadow:var(--shadow-xs);
}
.testi-card:hover{box-shadow:0 15px 30px rgba(0,0,0,0.04);transform:translateY(-3px)}
.t-stars{color:#F59E0B;font-size:.85rem;letter-spacing:.04em;margin-bottom:.9rem}
.t-text{font-size:.9rem;color:#334155;line-height:1.75;margin-bottom:1.25rem;font-style:italic}
.t-author{display:flex;align-items:center;gap:.75rem}
.t-av{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit',sans-serif;font-weight:800;font-size:.82rem;color:#fff;flex-shrink:0;
}
.t-name{font-weight:700;font-size:.85rem;color:#0F172A}
.t-role{font-size:.73rem;color:#64748B;margin-top:.15rem}

/* ═══════════════════════
   PRICING
   ═══════════════════════ */
.pricing-section{background:#FFFFFF;border-bottom:1px solid #E2E8F0}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8rem}
.plan-card{
  background:#fff;border:1.5px solid #E2E8F0;border-radius:var(--rxl);
  padding:2.2rem 1.8rem;transition:all .3s;position:relative;overflow:hidden;
  box-shadow:var(--shadow-xs);
}
.plan-card.popular{
  border-color:#3B82F6;
  box-shadow:0 20px 40px rgba(59,130,246,0.08),0 4px 15px rgba(0,0,0,0.02);
}
.plan-card.popular::before{
  content:'MOST POPULAR';
  position:absolute;top:1.1rem;right:1.1rem;
  background:#2563EB;color:#fff;
  font-size:.6rem;font-weight:800;letter-spacing:.12em;
  padding:.25rem .75rem;border-radius:var(--rf);
}
.plan-name{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.15rem;color:#0F172A;margin-bottom:.35rem}
.plan-price{
  font-family:'Outfit',sans-serif;font-weight:900;
  font-size:2.6rem;color:#0F172A;letter-spacing:-.05em;line-height:1;
  margin:.95rem 0 .35rem;
}
.plan-price sup{font-size:1.2rem;vertical-align:.45em;font-weight:800}
.plan-price sub{font-size:.78rem;font-weight:600;color:#64748B;letter-spacing:0}
.plan-sub{font-size:.82rem;color:#64748B;margin-bottom:1.6rem;line-height:1.6}
.plan-features{list-style:none;display:flex;flex-direction:column;gap:.75rem;margin-bottom:2rem}
.plan-features li{
  display:flex;align-items:flex-start;gap:.55rem;
  font-size:.84rem;color:#475569;line-height:1.55;
}
.plan-features li i{font-size:.75rem;margin-top:.25rem;flex-shrink:0}
.plan-features li i.ok{color:#10B981}
.plan-features li i.no{color:#9CA3AF}
.btn-plan{
  width:100%;padding:.75rem;border-radius:var(--rf);
  font-size:.88rem;font-weight:800;font-family:'Outfit',sans-serif;
  cursor:pointer;transition:all .22s;border:none;
}
.btn-plan-outline{
  background:transparent;color:#2563EB;
  border:1.5px solid #2563EB;
}
.btn-plan-outline:hover{background:#EFF6FF}
.btn-plan-filled{
  background:linear-gradient(135deg,var(--blue),#3B82F6);color:#fff;
  box-shadow:0 6px 18px rgba(37,99,235,.25);
}
.btn-plan-filled:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(37,99,235,.35)}
.btn-plan-dark{
  background:#0F172A;color:#fff;
}
.btn-plan-dark:hover{background:#1E293B}
.plan-card:hover:not(.popular){transform:translateY(-3px);box-shadow:var(--shadow-md)}

/* ═══════════════════════
   COMPARISON TABLE
   ═══════════════════════ */
.compare-section{background:#FFFFFF;border-bottom:1px solid #E2E8F0}
.compare-table{width:100%;border-collapse:collapse;border-radius:var(--rxl);overflow:hidden;border:1px solid #E2E8F0}
.compare-table th,.compare-table td{padding:1rem 1.4rem;text-align:center;font-size:.85rem;border-bottom:1px solid #E2E8F0}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;font-weight:700;color:#334155}
.compare-table thead th{background:#F8FAFC;font-weight:800;font-size:.78rem;color:#475569;letter-spacing:.06em;text-transform:uppercase}
.compare-table thead th.highlight{background:#EFF6FF;color:#2563EB}
.compare-table tbody tr:hover td{background:#F8FAFC}
.compare-table tbody tr:last-child td{border-bottom:none}
.cmp-yes{color:#10B981;font-size:.95rem}
.cmp-no{color:#9CA3AF;font-size:.95rem}
.cmp-partial{color:#F59E0B;font-size:.78rem;font-weight:700}

/* ═══════════════════════
   FAQ
   ═══════════════════════ */
.faq-section{background:#FFFFFF;border-bottom:1px solid #E2E8F0}
.faq-wrap{max-width:780px;margin:0 auto}
.faq-item{border-bottom:1px solid #E2E8F0}
.faq-q{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.35rem 0;cursor:pointer;
  font-weight:700;font-size:.95rem;color:#0F172A;
  transition:color .18s;
}
.faq-q:hover{color:#2563EB}
.faq-q i{
  color:#94A3B8;font-size:.8rem;flex-shrink:0;
  transition:transform .25s,color .18s;
}
.faq-q:hover i{color:#2563EB}
.faq-item.open .faq-q i{transform:rotate(45deg);color:#2563EB}
.faq-a{
  max-height:0;overflow:hidden;
  font-size:.88rem;color:#475569;line-height:1.75;
  transition:max-height .35s ease,padding .3s;
  padding:0;
}
.faq-item.open .faq-a{max-height:300px;padding-bottom:1.35rem}

/* ═══════════════════════
   CTA BAND (Modern dark gradient)
   ═══════════════════════ */
.cta-section{
  background:#090C15;
  padding:6.5rem 1.5rem;text-align:center;position:relative;overflow:hidden;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.cta-section::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 50%,rgba(59,130,246,.15) 0%,transparent 60%),
             radial-gradient(circle at 70% 50%,rgba(139,92,246,.12) 0%,transparent 60%);
}
.cta-inner{max-width:680px;margin:0 auto;position:relative;z-index:1}
.cta-pill{
  display:inline-flex;align-items:center;gap:.45rem;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:#FBBF24;border-radius:var(--rf);padding:.35rem 1rem;
  font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1.3rem;
}
.cta-h{
  font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4.2vw,2.8rem);
  font-weight:900;color:#fff;letter-spacing:-.04em;line-height:1.15;margin-bottom:1rem;
}
.cta-sub{color:#9CA3AF;font-size:1.02rem;margin-bottom:2.2rem;line-height:1.75}
.cta-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-cta-w{
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:.9rem;font-weight:800;color:#2563EB;
  background:#fff;padding:.8rem 1.8rem;border-radius:var(--rf);
  box-shadow:0 8px 24px rgba(0,0,0,.2);transition:all .22s;
  font-family:'Outfit',sans-serif;
}
.btn-cta-w:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.btn-cta-o{
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:.9rem;font-weight:800;color:#fff;
  background:transparent;border:2px solid rgba(255,255,255,.25);
  padding:.78rem 1.7rem;border-radius:var(--rf);
  transition:all .22s;font-family:'Outfit',sans-serif;
}
.btn-cta-o:hover{background:rgba(255,255,255,.06);border-color:#fff}

/* ═══════════════════════
   FOOTER (Dark)
   ═══════════════════════ */
footer{background:#090C15;color:#9CA3AF;padding:4rem 1.5rem 2rem;border-top:1px solid rgba(255,255,255,0.05)}
.footer-inner{max-width:1240px;margin:0 auto}
.footer-top{display:grid;grid-template-columns:2fr 1.1fr 1.1fr 1.1fr;gap:2.5rem;margin-bottom:3rem}
.footer-brand .logo-main{color:#fff;font-size:1.15rem}
.footer-tagline{font-size:.82rem;color:#6B7280;margin-top:.7rem;line-height:1.7;max-width:260px}
.footer-col-title{font-weight:800;font-size:.82rem;color:#FFFFFF;margin-bottom:1.1rem;letter-spacing:.05em;text-transform:uppercase;}
.footer-col-links{display:flex;flex-direction:column;gap:.65rem}
.footer-col-links a{font-size:.82rem;color:#9CA3AF;transition:color .18s;cursor:pointer}
.footer-col-links a:hover{color:#FFFFFF}
.footer-bottom{
  border-top:1px solid rgba(255,255,255,.06);padding-top:1.5rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;
}
.footer-copy{font-size:.8rem;color:#6B7280}
.footer-legal{display:flex;gap:1.5rem;flex-wrap:wrap}
.footer-legal a{font-size:.8rem;color:#6B7280;transition:color .18s}
.footer-legal a:hover{color:#FFFFFF}

<!-- MOBILE STICKY -->
<div class="mobile-sticky">

  <button class="btn-ms-p" onclick="openAuth('register')">Create Free Account</button>
</div>

<!-- ══ EDITOR OVERLAY ══ -->

      <div class="edt-doc-name" id="edtDocName">Document</div>
      <div class="edt-doc-sub" id="edtDocSub">Smart Form Editor</div>
    </div>
    <div class="edt-actions">
      <button class="btn-esign" onclick="openEsign()"><i class="fa-solid fa-fingerprint"></i> Aadhaar eSign</button>
      <button class="btn-dl" onclick="dlDoc()"><i class="fa-solid fa-download"></i> Download</button>
      <button class="btn-close-ed" onclick="closeEditor()"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <iframe class="editor-frame" id="editorFrame" src="" title="Legal Drafting Hub"></iframe>
</div>

<!-- ══ AUTH MODAL ══ -->
<div class="m-overlay" id="authModal">
  <div class="m-box">
    <button class="m-close" onclick="closeAuth()"><i class="fa-solid fa-xmark"></i></button>

    <!-- Logo -->
    <div class="m-logo">
      <div class="logo-mark" style="width:28px;height:28px;border-radius:8px">
        <svg viewBox="0 0 20 20" fill="none" width="13" height="13">
          <rect x="3" y="2" width="11" height="14" rx="1.5" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.3"/>
          <line x1="6" y1="6" x2="11" y2="6" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="6" y1="9" x2="11" y2="9" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="6" y1="12" x2="9" y2="12" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M13.5 13l3-3 1.5 1.5-3 3-2 .5.5-2z" fill="white" stroke="white" stroke-width=".4" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-wordmark" style="font-size:1.15rem">
        <span class="lw-part1">insta</span><span class="lw-part2">deed</span><span class="lw-tld" style="width:17px;height:17px;font-size:.58rem">in</span>
      </span>
    </div>

    <h2 class="m-h">Welcome to INSTADEED</h2>
    <p class="m-sub">Sign in or create an account in seconds to access your drafts.</p>

    <!-- Google Sign-In button -->
    <button class="btn-google" onclick="signInWithGoogle()" style="margin-bottom:1.1rem">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or verify mobile number</span></div>

    <!-- Phone input view -->
    <div id="authPhoneStep">
      <div class="f-grp" style="margin-bottom:1rem">
        <label class="f-label">Mobile Number</label>
        <div class="phone-input-wrap">
          <span class="phone-flag">+91</span>
          <input class="phone-inp" type="tel" id="phoneNum" placeholder="98765 43210" maxlength="10" oninput="checkPhone()">
        </div>
      </div>
      <button class="btn-fp" id="btnSendOtp" onclick="sendOtp()" style="opacity:.5;pointer-events:none">Send OTP via SMS</button>
    </div>

    <!-- OTP input view -->
    <div id="authOtpStep" style="display:none">
      <button class="auth-back-btn" onclick="authBackToPhone()" style="margin-bottom:1rem">
        <i class="fa-solid fa-arrow-left"></i> Edit mobile number
      </button>
      <p class="m-sub" style="font-size:.8rem;color:#64748B;margin-bottom:.85rem">
        We sent a 6-digit code to <strong id="otpPhoneNum" style="color:#0F172A">+91 XXXXX XXXXX</strong>
      </p>
      <div class="f-grp">
        <div class="otp-colors otp-boxes">
          <input class="otp-box" type="text" maxlength="1" id="ob0" oninput="otpNext(this,0)" onkeydown="otpKey(event,0)">
          <input class="otp-box" type="text" maxlength="1" id="ob1" oninput="otpNext(this,1)" onkeydown="otpKey(event,1)">
          <input class="otp-box" type="text" maxlength="1" id="ob2" oninput="otpNext(this,2)" onkeydown="otpKey(event,2)">
          <input class="otp-box" type="text" maxlength="1" id="ob3" oninput="otpNext(this,3)" onkeydown="otpKey(event,3)">
          <input class="otp-box" type="text" maxlength="1" id="ob4" oninput="otpNext(this,4)" onkeydown="otpKey(event,4)">
          <input class="otp-box" type="text" maxlength="1" id="ob5" oninput="otpNext(this,5)" onkeydown="otpKey(event,5)">
        </div>
      </div>
      <div class="otp-timer" style="margin:1.15rem 0 .7rem;font-size:.78rem">
        Didn't receive code? <span id="resendTimer"></span> <a href="#" id="resendLink" style="display:none;color:#2563EB;font-weight:700" onclick="resendOtp();return false">Resend OTP</a>
      </div>
      <button class="btn-fp" id="btnVerifyOtp" onclick="verifyOtp()" style="opacity:.5;pointer-events:none">Verify & Log In</button>
    </div>

  </div>
</div>

<!-- ══ AADHAAR ESIGN ══ -->
<div class="es-overlay" id="esignOverlay">
  <div class="es-box">
    <div class="es-head">
      <div class="es-head-row">

<script>
/* ─── DATA ─── */
const DOCS=[
  {id:'gnida-package',name:'GNIDA 5-in-1 Composite Package',cat:'gnida',icon:'fa-cubes',ic:'ic-b',badge:'pop'},
  {id:'gnida-kya',name:'GNIDA KYA Form',cat:'gnida',icon:'fa-id-card',ic:'ic-p',badge:'new'},

let activeCat='all', currentDoc=null;

function renderDocs(list){
  const g=document.getElementById('docsGrid');
  if(activeCat === 'yeida') {
    g.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:4rem 2rem;color:#64748B;background:#fff;border-radius:var(--rxl);border:1.5px dashed #E2E8F0;width:100%">

        <h3 style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1.15rem;color:#0F172A;margin-bottom:0.5rem">YEIDA Formats Locked</h3>

      </div>
    `;
    return;
  }
  if(activeCat === 'gda') {
    g.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:4rem 2rem;color:#64748B;background:#fff;border-radius:var(--rxl);border:1.5px dashed #E2E8F0;width:100%">
        <i class="fa-solid fa-lock" style="font-size:2.5rem;margin-bottom:1rem;color:#94A3B8;display:block"></i>
        <h3 style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1.15rem;color:#0F172A;margin-bottom:0.5rem">GDA Formats Locked</h3>
        <p style="font-size:0.85rem;color:#64748B;max-width:340px;margin:0 auto">Ghaziabad Development Authority templates are currently being aligned with GDA guidelines.</p>
      </div>
    `;
    return;
  }
  if(!list.length){g.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:4rem;color:#64748B;background:#fff;border-radius:var(--rl);border:1.5px solid #E2E8F0;width:100%"><i class="fa-solid fa-folder-open" style="font-size:2.2rem;margin-bottom:.8rem;display:block;opacity:.35"></i>No documents found.</div>`;return;}
  g.innerHTML=list.map(d=> {
    const badgeHtml = d.badge === 'new' ? `<span class="adobe-card-badge badge-new">NEW</span>` : d.badge === 'pop' ? `<span class="adobe-card-badge badge-pop">HOT</span>` : '';
    let desc = "";
    if(d.id==='gnida-package') desc = "Complete 5-in-1 pack including affidavit, indemnity bond, and application forms.";
    else if(d.id==='gnida-kya') desc = "Official Know Your Allottee verification forms for Greater Noida Authority.";
    else if(d.id==='gnida-mutation') desc = "Apply for official transfer of property records under GNIDA rules.";
    else if(d.id==='gnida-tm_app') desc = "Official Transfer Memorandum applications for plots and built-up properties.";
    else if(d.id==='gnida_ptm') desc = "Permission to Transfer Memorandum for GNIDA residential and commercial plots.";
    else if(d.id==='noida_transfer') desc = "Transfer of memorandum applications for property in Noida sectors.";
    else if(d.id==='rent-residential') desc = "Fully compliant residential tenancy agreement with e-stamp options.";
    else if(d.id==='ats') desc = "Agreement to Sell formatting aligned with standard Gautam Buddh Nagar registries.";
    else if(d.id==='gnida_registry') desc = "Sub-registrar office compliant registry deed drafts.";
    else if(d.id==='tm48') desc = "Authorization form for representation in Trademark registry hearings.";
    else if(d.id==='website-tos') desc = "Standard terms of service template for Indian e-commerce sites.";
    else if(d.id==='e-commerce-privacy') desc = "DPDP Act 2023 compliant privacy policy templates.";
    else if(d.id==='ecomm_rp') desc = "Clear refund and cancellation policies to resolve customer disputes.";

    return `
      <div class="adobe-card" onclick="openDoc('${d.id}')" role="button" tabindex="0" aria-label="Draft ${d.name}">

          <i class="fa-solid ${d.icon}"></i>
        </div>
        <h3 class="adobe-card-title">${d.name}</h3>
        <p class="adobe-card-desc">${desc || 'Authorized Gautam Buddh Nagar template for local legal filings.'}</p>
        <div class="adobe-card-action">
          <span class="adobe-card-link">Draft Now <i class="fa-solid fa-arrow-right"></i></span>
        </div>

}

function filterDocs(){
  const q=(document.getElementById('docsSearch').value||'').toLowerCase().trim();
  let l=activeCat==='all'?DOCS:DOCS.filter(d=>d.cat===activeCat);
  if(q) l=l.filter(d=>d.name.toLowerCase().includes(q));
  renderDocs(l);
}
function setCat(btn,cat){
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); activeCat=cat; filterDocs();
}
function openDocCat(cat){
  const btn=document.querySelector(`.cat-tab[data-cat="${cat}"]`);
  if(btn) setCat(btn,cat);
  scrollToDocs();
}
renderDocs(DOCS);

/* search */
function heroSearchFn(v){if(v.trim()){document.getElementById('docsSearch').value=v;filterDocs();scrollToDocs();}}
function quickSearch(t){document.getElementById('heroSearch').value=t;document.getElementById('docsSearch').value=t;filterDocs();scrollToDocs();}
function scrollToDocs(){document.getElementById('documents').scrollIntoView({behavior:'smooth'});}
function scrollToSection(id){document.getElementById(id).scrollIntoView({behavior:'smooth'});}
function scrollToTop(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});}

/* doc open */
function openDoc(id){
  const doc=DOCS.find(d=>d.id===id);if(!doc)return;
  currentDoc=doc;
  document.getElementById('edtDocName').textContent=doc.name;
  document.getElementById('edtDocSub').textContent='Smart Form Editor';
  const url=`Madhav_Drafting_Hub.html?v=${Date.now()}&solo=1&doc=${encodeURIComponent(id)}&name=${encodeURIComponent(doc.name)}`;
  document.getElementById('editorFrame').src=url;
  document.getElementById('editorOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeEditor(){
  document.getElementById('editorOverlay').classList.remove('open');
  document.getElementById('editorFrame').src='';
  document.body.style.overflow='';
  currentDoc=null;
}
function dlDoc(){
  const frame = document.getElementById('editorFrame');
  if(frame && frame.contentWindow){
    frame.contentWindow.focus();
    frame.contentWindow.print();
  } else {
    alert('Downloading PDF…\n\n(Connect your backend to enable PDF export.)');
  }
}

/* auth */
function openAuth(view){
  document.getElementById('authPhoneStep').style.display='block';
  document.getElementById('authOtpStep').style.display='none';
  document.getElementById('phoneNum').value='';
  document.getElementById('btnSendOtp').style.opacity='.5';
  document.getElementById('btnSendOtp').style.pointerEvents='none';
  document.getElementById('authModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeAuth(){document.getElementById('authModal').classList.remove('open');document.body.style.overflow='';}
document.getElementById('authModal').addEventListener('click',function(e){if(e.target===this)closeAuth();});

/* esign */
let otpIv=null;
function openEsign(){
  if(!currentDoc)return;
  document.getElementById('esDocLabel').textContent=currentDoc.name;
  document.getElementById('esignOverlay').classList.add('open');
  resetEs();
}
function closeEsign(){document.getElementById('esignOverlay').classList.remove('open');if(otpIv)clearInterval(otpIv);}
document.getElementById('esignOverlay').addEventListener('click',function(e){if(e.target===this)closeEsign();});
function resetEs(){
  setEsStep(1);
  document.getElementById('aadNum').value='';
  document.getElementById('aadName').value='';
  ['o1','o2','o3','o4','o5','o6'].forEach(id=>document.getElementById(id).value='');
  if(otpIv)clearInterval(otpIv);
}
function setEsStep(n){
  [1,2,3].forEach(i=>{
    document.getElementById('esS'+i).classList.toggle('active',i===n);
    const d=document.getElementById('ep'+i);
    if(i<n){d.className='ep-d done';d.innerHTML='<i class="fa-solid fa-check" style="font-size:.58rem"></i>';}
    else if(i===n){d.className='ep-d active';d.textContent=i;}
    else{d.className='ep-d pend';d.textContent=i;}
    if(i<3)document.getElementById('el'+i).classList.toggle('done',i<n);
  });
}
function fmtAadhaar(el){let v=el.value.replace(/\D/g,'').substring(0,12);el.value=v.replace(/(\d{4})(?=\d)/g,'$1 ');}
function esS1Next(){
  const a=document.getElementById('aadNum').value.replace(/\s/g,''),n=document.getElementById('aadName').value.trim();
  if(a.length!==12){alert('Enter a valid 12-digit Aadhaar number.');return;}
  if(!n){alert('Enter your name as per Aadhaar.');return;}
  document.getElementById('mMob').textContent='xxxxxxxx'+a.slice(-2);
  setEsStep(2);startOtpTimer(300);document.getElementById('o1').focus();
}
function esS2Next(){
  const otp=['o1','o2','o3','o4','o5','o6'].map(id=>document.getElementById(id).value).join('');
  if(otp.length!==6){alert('Enter the complete 6-digit OTP.');return;}
  if(otpIv)clearInterval(otpIv);
  const nm=document.getElementById('aadName').value.trim();
  const now=new Date();
  const ds=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('certInfo').textContent=`Signed: ${ds} | By: ${nm} | Authority: NSDL e-Gov (Aadhaar OTP eSign)`;
  
  if (currentDoc) {
    localStorage.setItem('instadeed_signed_' + currentDoc.id, JSON.stringify({
      signed: true,
      signerName: nm,
      signedAt: ds
    }));
  }
  
  setEsStep(3);
}
function esBack(){if(otpIv)clearInterval(otpIv);setEsStep(1);}
function startOtpTimer(s){
  if(otpIv)clearInterval(otpIv);let r=s;
  function u(){const m=Math.floor(r/60).toString().padStart(2,'0'),sec=(r%60).toString().padStart(2,'0');const el=document.getElementById('otpClock');if(el)el.textContent=m+':'+sec;if(r<=0)clearInterval(otpIv);r--;}
  u();otpIv=setInterval(u,1000);
}
function resendOtp(e){e.preventDefault();['o1','o2','o3','o4','o5','o6'].forEach(id=>document.getElementById(id).value='');startOtpTimer(300);document.getElementById('o1').focus();alert('OTP resent.');}
function oFwd(el,nid){if(el.value.length===1&&nid)document.getElementById(nid).focus();}
function oBk(e,el,pid){if(e.key==='Backspace'&&el.value===''&&pid)document.getElementById(pid).focus();}
function dlSigned(){
  const frame = document.getElementById('editorFrame');
  if(frame && frame.contentWindow){
    frame.contentWindow.focus();
    frame.contentWindow.print();
  } else {
    alert('Downloading signed PDF with eSignature certificate…\n\n(Connect your backend to enable this.)');
  }
}

/* FAQ toggle */
function toggleFaq(q){

/* Nav scroll */

/* Escape key */
document.addEventListener('keydown',e=>{

    if(document.getElementById('esignOverlay').classList.contains('open'))closeEsign();

  }

/* ─── GOOGLE SIGN-IN & USER STATE ───────────────────────────── */
const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // ← replace this

/* Initialize Google Identity Services */
function initGoogle(){
  if(typeof google === 'undefined' || !google.accounts) return;
  if(GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') return; // not configured
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    auto_select: false,
    cancel_on_tap_outside: true
  });
}

/* Called when user clicks "Continue with Google" */
function signInWithGoogle(){
  if(GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID'){
    const mockUser = {
      name: "Demo Signee",
      email: "google.signee@instadeed.com",
      picture: "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y"
    };
    handleGoogleLogin(mockUser);
    return;
  }
  try{
    google.accounts.id.prompt((notification)=>{
      if(notification.isNotDisplayed() || notification.isSkippedMoment()){
        google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile',
          callback: (resp)=>{ if(resp.access_token) fetchGoogleProfile(resp.access_token); }
        }).requestAccessToken();
      }
    });
  }catch(e){
    console.warn('Google GSI error:',e);
  }
}

/* Handles JWT credential from Google One Tap */
function handleGoogleCredential(response){
  try{
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    handleGoogleLogin({
      name: payload.name,
      email: payload.email,
      picture: payload.picture
    });
  }catch(e){ console.error('Google credential error',e); }
}

/* Fetch profile via access token */
async function fetchGoogleProfile(token){
  try{
    const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo',
      {headers:{Authorization:'Bearer '+token}});
    const u = await r.json();
    handleGoogleLogin({name:u.name, email:u.email, picture:u.picture});
  }catch(e){ console.error('Google profile fetch error',e); }
}

/* Central login handler */
function handleGoogleLogin(user){
  localStorage.setItem('instadeed_user_session', JSON.stringify(user));
  applyLoggedInState(user);
  closeAuth();
  showToast('✅ Welcome, '+user.name.split(' ')[0]+'!');
}

/* Apply logged-in state to nav */
function applyLoggedInState(user){
  const area = document.getElementById('navAuthArea');
  const chip = document.getElementById('userChip');
  const avatar = document.getElementById('userAvatar');
  const nameEl = document.getElementById('userName');
  const emailEl = document.getElementById('userMenuEmail');
  if(!area) return;
  area.classList.add('nav-auth-signed-in');
  chip.style.display = 'flex';
  nameEl.textContent = user.name.split(' ')[0];
  emailEl.textContent = user.email||'';
  if(user.picture){
    avatar.innerHTML = '<img src="'+user.picture+'" alt="avatar">';
  } else {
    avatar.textContent = (user.name||'U')[0].toUpperCase();
  }
}

/* Toggle user dropdown */
function toggleUserMenu(){
  const m = document.getElementById('userMenu');
  m.style.display = m.style.display==='none' ? 'block' : 'none';
}
document.addEventListener('click', e=>{
  const chip = document.getElementById('userChip');
  const menu = document.getElementById('userMenu');
  if(chip && menu && !chip.contains(e.target)) menu.style.display='none';
});

/* Sign out */
function signOut(){
  localStorage.removeItem('instadeed_user_session');
  const area = document.getElementById('navAuthArea');
  const chip = document.getElementById('userChip');
  if(area) area.classList.remove('nav-auth-signed-in');
  if(chip) chip.style.display='none';
  document.getElementById('userMenu').style.display='none';
  if(typeof google !== 'undefined' && google.accounts)
    google.accounts.id.disableAutoSelect();
  showToast('👋 Signed out successfully');
}

/* Restore session on page load */
window.addEventListener('DOMContentLoaded', ()=>{
  initGoogle();
  const saved = localStorage.getItem('instadeed_user_session');
  if(saved){ try{ applyLoggedInState(JSON.parse(saved)); }catch(e){} }
});

/* Sync session changes */
window.addEventListener('storage', (e)=>{
  if(e.key === 'instadeed_user_session'){
    if(e.newValue){
      try{ applyLoggedInState(JSON.parse(e.newValue)); }catch(err){}
    } else {
      const area = document.getElementById('navAuthArea');
      const chip = document.getElementById('userChip');
      if(area) area.classList.remove('nav-auth-signed-in');
      if(chip) chip.style.display='none';
      document.getElementById('userMenu').style.display='none';
    }
  }
});

  document.getElementById('authOtpStep').style.display='none';

  document.getElementById('btnSendOtp').style.pointerEvents='none';

  setTimeout(()=>document.getElementById('phoneNum').focus(),100);
}

function checkPhone(){
  const v = document.getElementById('phoneNum').value.replace(/\D/g,'');
  document.getElementById('phoneNum').value = v;
  const btn = document.getElementById('btnSendOtp');
  if(v.length===10){
    btn.style.opacity='1'; btn.style.pointerEvents='auto';
  } else {
    btn.style.opacity='.5'; btn.style.pointerEvents='none';
  }
}

function sendOtp(){
  const phone = document.getElementById('phoneNum').value.trim();
  if(phone.length!==10){ showToast('Please enter a valid 10-digit number'); return; }

  document.getElementById('authPhoneStep').style.display='none';
  document.getElementById('authOtpStep').style.display='block';
  document.getElementById('otpPhoneNum').textContent='+91 '+phone.slice(0,5)+' '+phone.slice(5);

  for(let i=0;i<6;i++){
    const b=document.getElementById('ob'+i);
    b.value=''; b.classList.remove('filled','error');
  }
  setTimeout(()=>document.getElementById('ob0').focus(),100);
  document.getElementById('btnVerifyOtp').style.opacity='.5';
  document.getElementById('btnVerifyOtp').style.pointerEvents='none';

  showToast('📱 OTP sent to +91 '+phone);
  startResendTimer();
}

function startResendTimer(){
  let t=30;
  const link=document.getElementById('resendLink');
  const timer=document.getElementById('resendTimer');
  link.style.display='none';
  timer.textContent=' (resend in '+t+'s)';
  clearInterval(resendInterval);
  resendInterval = setInterval(()=>{
    t--;
    timer.textContent=' (resend in '+t+'s)';
    if(t<=0){
      clearInterval(resendInterval);
      link.style.display='inline';
      timer.textContent='';
    }
  },1000);
}

function resendOtp(){ sendOtp(); }

function otpNext(el,idx){
  el.value=el.value.replace(/\D/g,'').slice(-1);
  el.classList.toggle('filled', el.value!=='');
  checkOtpComplete();
  if(el.value && idx<5) document.getElementById('ob'+(idx+1)).focus();
}

function otpKey(e,idx){
  if(e.key==='Backspace'&&!document.getElementById('ob'+idx).value&&idx>0)
    document.getElementById('ob'+(idx-1)).focus();
  if(e.key==='ArrowLeft'&&idx>0) document.getElementById('ob'+(idx-1)).focus();
  if(e.key==='ArrowRight'&&idx<5) document.getElementById('ob'+(idx+1)).focus();
}

function checkOtpComplete(){
  let full=true;
  for(let i=0;i<6;i++) if(!document.getElementById('ob'+i).value) full=false;
  const btn=document.getElementById('btnVerifyOtp');
  btn.style.opacity = full?'1':'.5';
  btn.style.pointerEvents = full?'auto':'none';
}

function verifyOtp(){
  let code='';
  for(let i=0;i<6;i++) code+=document.getElementById('ob'+i).value;
  if(code.length<6){ showToast('Please enter the 6-digit OTP'); return; }

  const phone = document.getElementById('phoneNum').value;
  const btn=document.getElementById('btnVerifyOtp');
  btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin" style="margin-right:.4rem"></i>Verifying...';
  btn.style.opacity='.7'; btn.style.pointerEvents='none';

  setTimeout(()=>{
    const user={
      name:'User '+phone.slice(-4), 
      phone:'+91'+phone, 
      email: phone+'@instadeed.com', 
      picture:null
    };
    handleGoogleLogin(user);
    clearInterval(resendInterval);
    btn.innerHTML='Verify & Log In';
  }, 1200);
}

function showToast(msg){
  let t = document.getElementById('authToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'authToast';
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:2000;background:#0F172A;color:#fff;padding:.75rem 1.25rem;border-radius:10px;font-family:\'Inter\',sans-serif;font-size:.85rem;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.2);display:flex;align-items:center;gap:.5rem;transform:translateY(100px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;';
    document.body.appendChild(t);
  }
  t.innerHTML = msg;
  t.style.transform = 'none';
  t.style.opacity = '1';
  setTimeout(()=>{
    t.style.transform = 'translateY(100px)';
    t.style.opacity = '0';
  }, 3000);
}
</script>
</body>
</html>
