version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:./data/instadeed_admin.db
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string}
      NODE_ENV: production
    volumes:
      - admin_data:/app/prisma/data
      - storage_data:/app/storage
    command: sh -c "npx prisma db push --accept-data-loss && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  admin_data:
  storage_data:
