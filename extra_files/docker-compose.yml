version: "3.9"

services:
  app:
    build: .
    container_name: instadeed
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./madhav_crm.db:/app/madhav_crm.db
      - ./server.log:/app/server.log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

